  line-height: 1;
}

.anticon svg {
  display: inline-block;
}

.anticon::before {

}

  display: block;
}

.anticon[tabindex] {

.anticon-spin {

    transform: rotate(360deg);
  }
}

  100% {
    -webkit-transform: rotate(360deg);
    transform: rotate(360deg);
  }
}
